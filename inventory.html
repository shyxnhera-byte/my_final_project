<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Inventory</title>
</head>
<body>
        <div class="app">
      <nav class="sidebar">
        <div class="sidebar-header">
          <span class="logo-icon">🛒</span>
          <div>
            <h2>ShopTracker</h2>
            <p class="tagline">Inventory and sales tracker</p>
          </div>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">🏠 Dashboard</a></li>
          <li><a href="inventory.html"> 📦 Inventory</a></li>
          <li><a href="sales.html">🛒 Sales</a></li>
          <li><a href="history.html"> 🕒 Sales history</a></li>
        </ul>
      </nav>
       <main>
        <header class="topbar">
          <button class="menu-button">☰</button>
          <div class="user-area">
            <span>Admin</span>
            <span>👤</span>
          </div>
        </header>
        <section class="inventory-content">
            <h1>Inventory</h1>
            <p>Manage your products and stock levels.</p>

        </section>
        <section class="add-product">
            <h2>Add New Product</h2>
            <form>
                <label for="product-name">Product Name</label>
                <input type="text" id="product-name" name="product-name">
                <label for="category">Category</label>
                <input type="text" id="category" name="category">
                <label for="buying-price">Buying Price</label>
                <input type="number" id="buying-price" name="buying-price">
                <label for="selling-price">Selling Price</label>
                <input type="number" id="selling-price" name="selling-price">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity">
                <label for="low-stock">Low Stock Alert</label>
                <input type="number" id="low-stock" name="low-stock">
                <button type="submit">Add Product</button>

            </form>
        </section>
       </main>
</body>
</html>
